# Deploys to the VPS (https://pawconnect.minolingo.online) on every push to main.
# The SSH key in VPS_SSH_KEY can only run /usr/local/bin/pawconnect-deploy on the server
# (a copy of that script is in deploy/pawconnect-deploy.sh), so this job just connects.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:   # "Run workflow" button in the Actions tab

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Keepalives: package installs can run silently for minutes, and idle SSH connections get dropped.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \n              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$TARGET"

      - name: Check the live site
        run: curl -fsS --retry 5 --retry-delay 5 https://pawconnect.minolingo.online/api/health
